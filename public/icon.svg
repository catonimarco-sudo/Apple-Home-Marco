<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Outer Smart Ring Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="8" />
  
  <!-- Home Roof & Structure -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Roof -->
    <path d="M140 260 L256 160 L372 260" fill="none" stroke="url(#iconGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chimney/Signal -->
    <path d="M320 200 L320 170" fill="none" stroke="url(#iconGrad)" stroke-width="18" stroke-linecap="round" />
    <!-- Walls & Door -->
    <path d="M176 250 L176 360 C176 368.8 183.2 376 192 376 L320 376 C328.8 376 336 368.8 336 360 L336 250" fill="none" stroke="url(#iconGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Door / Central Portal -->
    <path d="M228 376 L228 308 C228 296.9 236.9 288 248 288 L264 288 C275.1 288 284 296.9 284 308 L284 376" fill="#f59e0b" fill-opacity="0.25" stroke="url(#iconGrad)" stroke-width="14" stroke-linejoin="round" />
    <!-- Smart Node Pulse Dot -->
    <circle cx="256" cy="226" r="14" fill="#fbbf24" />
  </g>
</svg>
